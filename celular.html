<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZtock · Vista Móvil</title>
<style>
  :root{
    --bg:#07080a; --surface:#0a0b0d; --card:#111317; --line:#23262d;
    --text:#f4f5f7; --muted:#9aa0ab; --accent:#8b8cff; --green:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0}
  .glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(90px)}
  .glow::before{width:620px;height:620px;background:radial-gradient(circle,rgba(139,140,255,.42),transparent 65%)}
  .glow::after{width:520px;height:520px;background:radial-gradient(circle,rgba(52,211,153,.28),transparent 65%)}

  .stage{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(40px,7vw,120px);padding:24px}

  /* Bloque izquierdo */
  .info{max-width:380px;display:flex;flex-direction:column;gap:28px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.02em}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--green));display:grid;place-items:center;box-shadow:0 6px 24px rgba(139,140,255,.35)}
  .logo b{color:var(--accent);font-weight:700}
  .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
  .tag i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  h1{font-size:clamp(28px,2.6vw,40px);line-height:1.12;letter-spacing:-.03em;font-weight:700}
  h1 span{display:block;color:var(--muted);font-weight:500;font-size:.62em;letter-spacing:-.01em;margin-top:10px}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  li{display:flex;align-items:center;gap:12px;font-size:16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  li svg{flex:none}
  .btn{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:11px;background:var(--accent);color:#0a0b0d;font-weight:650;font-size:15px;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 28px rgba(139,140,255,.35)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(139,140,255,.5)}
  .btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}
  .foot{font-size:12px;color:var(--muted)}
  .btn .short{display:none}

  /* Teléfono */
  .phone-slot{position:relative;flex:none}
  .phone{position:absolute;top:0;left:0;width:414px;height:868px;transform-origin:top left}
  .bezel{
    position:absolute;inset:0;border-radius:64px;padding:12px;
    background:linear-gradient(145deg,#3a3d44 0%,#16181c 22%,#0c0d10 50%,#1b1d22 78%,#3d4048 100%);
    box-shadow:0 0 0 1px #2c2f36,inset 0 0 0 1px rgba(255,255,255,.08),0 40px 120px rgba(0,0,0,.7),0 0 80px rgba(139,140,255,.12);
  }
  .bezel::before{content:"";position:absolute;inset:4px;border-radius:60px;border:1px solid rgba(255,255,255,.05);pointer-events:none}
  .btn-side{position:absolute;background:linear-gradient(90deg,#2a2c32,#3c3f46);border-radius:2px}
  .b1{left:-3px;top:150px;width:3px;height:30px}
  .b2{left:-3px;top:205px;width:3px;height:56px}
  .b3{left:-3px;top:272px;width:3px;height:56px}
  .b4{right:-3px;top:230px;width:3px;height:88px;background:linear-gradient(270deg,#2a2c32,#3c3f46)}
  .screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--surface)}
  .status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 42px;font-size:15px;font-weight:600;z-index:3;pointer-events:none;background:linear-gradient(var(--surface) 70%,rgba(10,11,13,0))}
  .status .right{display:flex;align-items:center;gap:6px}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:4;pointer-events:none}
  .island::after{content:"";position:absolute;right:14px;top:12px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3550,#0a0c12 70%)}
  iframe{position:absolute;top:50px;left:0;width:100%;height:calc(100% - 50px - 30px);border:0;display:block;background:var(--surface)}
  .homebar-zone{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--surface);z-index:3;pointer-events:none}
  .homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);z-index:4;pointer-events:none}
  .loader{position:absolute;inset:50px 0 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:13px;z-index:1}
  .spin{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* Pantallas angostas: bloque compacto arriba, sin viñetas */
  @media (max-width:900px){
    .stage{flex-direction:column;gap:16px;padding:14px 16px}
    .info{max-width:none;width:100%;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
    .info .tag,.info h1,.info ul,.info .foot{display:none}
    .btn{padding:9px 14px;font-size:13px;align-self:auto;box-shadow:none}
    .btn .full{display:none}
    .btn .short{display:inline}
  }
  @media (max-width:900px) and (min-height:0){ .logo{font-size:19px} .logo-mark{width:30px;height:30px} }
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="glow" id="glow"></div>

<main class="stage">
  <section class="info">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0b0d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg>
      </div>
      <span>EZ<b>tock</b></span>
    </div>

    <span class="tag"><i></i>Demo en vivo</span>

    <h1>Vista Móvil<span>App para Dueños de Restaurante</span></h1>

    <ul>
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
        Control de mermas en terreno
      </li>
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        Food Cost al instante
      </li>
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/></svg>
        Órdenes por WhatsApp en 1 toque
      </li>
    </ul>

    <a class="btn" href="https://negroykpza.github.io/eztock-demo/" target="_blank" rel="noopener">
      <span><span class="full">Abrir versión </span><span class="short">Escritorio</span><span class="full">escritorio</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
    </a>

    <span class="foot">Datos de demostración · Valores en $ CLP</span>
  </section>

  <div class="phone-slot" id="slot">
    <div class="phone" id="phone">
      <div class="btn-side b1"></div><div class="btn-side b2"></div><div class="btn-side b3"></div><div class="btn-side b4"></div>
      <div class="bezel">
        <div class="screen">
          <div class="status">
            <span id="clock">9:41</span>
            <span class="right" aria-hidden="true">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="#f4f5f7"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="#f4f5f7"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.3-1.3A10.3 10.3 0 0 0 8 .3 10.3 10.3 0 0 0 .7 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.7 1.8l1.3 1.3A4.8 4.8 0 0 1 8 5.8zm0 3.6c-.6 0-1.1.2-1.5.6L8 11.5 9.5 10c-.4-.4-.9-.6-1.5-.6z"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#f4f5f7" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#f4f5f7"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#f4f5f7" fill-opacity=".4"/></svg>
            </span>
          </div>
          <div class="island"></div>
          <div class="loader" id="loader"><div class="spin"></div>Cargando EZtock…</div>
          <iframe id="app" src="https://negroykpza.github.io/eztock-demo/" title="EZtock app móvil" loading="eager" allow="clipboard-write"></iframe>
          <div class="homebar-zone"></div>
          <div class="homebar"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  var PW=414, PH=868;
  var slot=document.getElementById('slot'), phone=document.getElementById('phone');
  var glow=document.getElementById('glow');
  function fit(){
    var vw=window.innerWidth, vh=window.innerHeight, narrow=vw<=900;
    var availH, availW;
    if(narrow){
      var info=document.querySelector('.info');
      availH=vh-28-16-info.offsetHeight-8;
      availW=vw-32;
    }else{
      availH=vh-64;
      availW=vw-48-380-Math.min(120,Math.max(40,vw*.07))-24;
    }
    var s=Math.min(availH/PH, availW/PW, 1.15);
    s=Math.max(s,.2);
    phone.style.transform='scale('+s+')';
    slot.style.width=(PW*s)+'px';
    slot.style.height=(PH*s)+'px';
    var r=slot.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    glow.style.setProperty('--cx',cx+'px');
    var a=glow, st=a.style;
    st.cssText='';
    var css='.glow::before{left:'+(cx-380)+'px;top:'+(cy-420)+'px}.glow::after{left:'+(cx-140)+'px;top:'+(cy-60)+'px}';
    var tag=document.getElementById('glowpos');
    if(!tag){tag=document.createElement('style');tag.id='glowpos';document.head.appendChild(tag);}
    tag.textContent=css;
  }
  function clock(){
    var d=new Date();
    document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  }
  window.addEventListener('resize',fit);
  fit(); clock(); setInterval(clock,15000);
  document.getElementById('app').addEventListener('load',function(){
    var l=document.getElementById('loader'); if(l) l.style.display='none';
  });
})();
</script>
</body>
</html>
